[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hidprompt"
version = "0.1.0"
description = "Local-first scanner for prompt-injection signals and obfuscation patterns."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
hidprompt = "hidprompt.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
